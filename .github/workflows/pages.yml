# Deploys the free live demo to GitHub Pages:
#   /            landing (light web)
#   /admin.html  ops console (embedded engine)
#   /app/        full React Native app via Expo web export (embedded engine)
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Install app deps
        working-directory: app-mobile
        run: npm ci

      - name: Export the React Native app for web
        working-directory: app-mobile
        run: npx expo export --platform web --output-dir ../_site/app

      - name: Assemble site (landing + console + engine)
        run: |
          cp -r web/* _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
