name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Syntax check (all server + script sources)
        run: |
          for f in server/*.js scripts/*.js; do node --check "$f"; done

      - name: Smoke test — full ride lifecycle + security assertions
        run: npm test

      - name: Load probe — latency budget on CI hardware
        run: |
          node server/index.js & SERVER=$!
          sleep 3
          node scripts/loadtest.js --conns 20 --secs 8
          kill $SERVER

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install app deps
        working-directory: app-mobile
        run: npm ci
      - name: Expo web export — proves the RN bundle compiles
        working-directory: app-mobile
        run: npx expo export --platform web

  docker:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ryder:ci .
      - name: Container boots & becomes ready
        run: |
          docker run -d --name ryder -p 4321:4321 -e RYDER_SECRET=ci-secret ryder:ci
          for i in $(seq 1 20); do
            sleep 2
            if curl -fsS http://localhost:4321/ready; then exit 0; fi
          done
          docker logs ryder; exit 1
